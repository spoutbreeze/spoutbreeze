networks:
  default:
    name: spoutbreeze-net

volumes:
  pgdata:
  redisdata:
  rabbitdata:

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: spoutbreeze_u
      POSTGRES_PASSWORD: spoutbreeze_pass
      POSTGRES_DB: spoutbreeze
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoutbreeze_u -d spoutbreeze"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.8.2-trixie
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: spoutbreeze
      RABBITMQ_DEFAULT_PASS: spoutbreeze
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbit-declarer:
    image: curlimages/curl:8.19.0
    volumes:
      - ./rabbitmq/definitions.json:/definitions.json:ro
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "curl -sSf -u spoutbreeze:spoutbreeze -H 'content-type: application/json' -X POST --data-binary @/definitions.json http://rabbitmq:15672/api/definitions"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  manager:
    image: spoutbreeze-manager:local
    build:
      context: ..
      dockerfile: deploy/java.Dockerfile
      target: manager
    environment:
      RABBITMQ_URI: amqp://spoutbreeze:spoutbreeze@rabbitmq:5672
      JDBC_URL: jdbc:postgresql://postgres:5432/spoutbreeze
      JDBC_USER: spoutbreeze_u
      JDBC_PASSWORD: spoutbreeze_pass
      BBB_FQDN: ${BBB_FQDN:?set BBB_FQDN in deploy/.env}
      BBB_API_URL: ${BBB_API_URL:?set BBB_API_URL in deploy/.env}
      BBB_CHECKSUM_ALGO: ${BBB_CHECKSUM_ALGO:-sha1}
      BBB_SHARED_SECRET: ${BBB_SHARED_SECRET:?set BBB_SHARED_SECRET in deploy/.env}
      SPB_CALLBACK_BASE: ${SPB_CALLBACK_BASE:-}
      SPB_PLUGIN_MANIFEST_URL: ${SPB_PLUGIN_MANIFEST_URL:-}
    ports:
      - "21020:21020"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  interactor:
    image: spoutbreeze-interactor:local
    build:
      context: ..
      dockerfile: deploy/java.Dockerfile
      target: interactor
    environment:
      REDIS_URI: redis://redis:6379
      RABBITMQ_URI: amqp://spoutbreeze:spoutbreeze@rabbitmq:5672
      SPB_API_URL: http://web-legacy-nginx/api
      SPB_CALLBACK_BASE: ${SPB_CALLBACK_BASE:-http://interactor:8081}
      SPB_BBB_SECRET: ${BBB_SHARED_SECRET:?set BBB_SHARED_SECRET in deploy/.env}
      SPB_BBB_CHECKSUM_ALGO: ${BBB_CHECKSUM_ALGO:-sha1}
      JDBC_URL: jdbc:postgresql://postgres:5432/spoutbreeze
      JDBC_USER: spoutbreeze_u
      JDBC_PASSWORD: spoutbreeze_pass
      # Chat gateway (Twitch IRC relay), off until configured
      CHAT_TWITCH_ENABLED: ${CHAT_TWITCH_ENABLED:-false}
      TWITCH_CHAT_TOKEN: ${TWITCH_CHAT_TOKEN:-}
      TWITCH_CHAT_NICK: ${TWITCH_CHAT_NICK:-spoutbreeze-bot}
      TWITCH_CHAT_CHANNEL: ${TWITCH_CHAT_CHANNEL:-}
      CHAT_MIN_INTERVAL_MS: ${CHAT_MIN_INTERVAL_MS:-2000}
      CHAT_FACEBOOK_ENABLED: ${CHAT_FACEBOOK_ENABLED:-false}
      FACEBOOK_CHAT_TOKEN: ${FACEBOOK_CHAT_TOKEN:-}
      CHAT_FACEBOOK_POLL_MS: ${CHAT_FACEBOOK_POLL_MS:-10000}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  app-php:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    image: spoutbreeze-app:local
    environment:
      # APP_ENV is the only variable the PHP side reads, and only to choose
      # which app/config/config-<environment>.ini Fat-Free loads. Everything
      # else is configured in those ini files, which Fat-Free hot-loads.
      # A production install mounts its own config-production.ini here — see
      # app/config/config-production.ini.sample.
      APP_ENV: development
      LOG_JSON: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/spoutbreeze/public:ro
    ports:
      - "8091:80"
    depends_on:
      - app-php
    restart: unless-stopped
