volumes:
  videos:

services:
  agent:
    image: spoutbreeze-agent:local
    build:
      context: ..
      dockerfile: deploy/java.Dockerfile
      target: agent
    environment:
      RABBITMQ_URI: amqp://spoutbreeze:spoutbreeze@rabbitmq:5672
      JDBC_URL: jdbc:postgresql://postgres:5432/spoutbreeze
      JDBC_USER: spoutbreeze_u
      JDBC_PASSWORD: spoutbreeze_pass
      GRID_ENDPOINT: http://websummoner:4444/wd/hub
      AGENT_NAME: local
      SPB_API_URL: http://app-nginx
      SPB_API_KEY: spoutbreeze-dev-api-key
    ports:
      - "21030:21030"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      websummoner:
        condition: service_started
    restart: unless-stopped

  websummoner:
    image: websummoner/websummoner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/websummoner/browsers.json:ro
      - videos:/opt/websummoner/video
    command:
      - "-limit"
      - "5"
      - "-container-network"
      - "spoutbreeze-net"
      - "-video-recorder-image"
      - "spoutbreeze-streamer:local"
      - "-max-timeout"
      - "8h"
    ports:
      - "4444:4444"
    restart: unless-stopped

  streamer:
    image: spoutbreeze-streamer:local
    build:
      context: ../spoutbreeze-streamer
    entrypoint: ["sleep", "infinity"]
    profiles:
      - build
