services:
  # Development overlay for the console: the image copies the source at build
  # time, which is right for a release but means every edit needs a rebuild.
  # Mounting the working tree — and the Sukarix checkout the path repository
  # points at — makes application and framework changes take effect on the
  # next request instead.
  app-php:
    volumes:
      - ../app:/var/www/spoutbreeze/app
      - ../db:/var/www/spoutbreeze/db
      - ../public:/var/www/spoutbreeze/public
      - ../tests:/var/www/spoutbreeze/tests
      - ../tools:/var/www/spoutbreeze/tools
      - ../composer.json:/var/www/spoutbreeze/composer.json:ro
      # The image ships a dev-free vendor, which has no Statera and so cannot
      # run the test suite; development mounts the working-tree vendor over it.
      # Composer resolves the framework from Packagist so that a clone of this
      # repository builds anywhere, and these two mounts put the local
      # checkouts back on top, so framework changes are still live here.
      - ../vendor:/var/www/spoutbreeze/vendor
      - ../../../sukarix/sukarix:/var/www/spoutbreeze/vendor/sukarix/sukarix
      - ../../../sukarix/statera:/var/www/spoutbreeze/vendor/sukarix/statera

  web-legacy-php:
    build:
      context: ..
      dockerfile: deploy/web-legacy.Dockerfile
    image: spoutbreeze-web-legacy:local
    environment:
      SPB_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web-legacy-nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/legacy-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - web-legacy-php
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "1935:1935"
    restart: unless-stopped
