server {
  listen 80;
  server_name _;

  root /var/www/spoutbreeze/public;
  index index.php;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  location / {
    try_files $uri $uri/ @f3;
  }

  # Viewer pages: /watch/<event> serves the static player, which pulls the
  # playlist from /live/<event>/ on the player edge.
  location /watch/ {
    try_files $uri /watch/index.html;
  }

  location /live/ {
    proxy_pass http://player-edge:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location @f3 {
    rewrite ^ /index.php;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass app-php:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # catch-all server_name is "_" — Fat-Free builds reroute URLs from
    # SERVER_NAME, so hand it the real host or every redirect targets http://_/
    fastcgi_param SERVER_NAME $host;
    fastcgi_read_timeout 60;
  }

  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
  }
}
