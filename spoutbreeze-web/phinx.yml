paths:
    migrations: '%%PHINX_CONFIG_DIR%%/db/migrations'
    seeds: '%%PHINX_CONFIG_DIR%%/db/seeds'

environments:
    default_migration_table: phinxlog
    default_database: development
    production:
        adapter: pgsql
        host: '127.0.0.1'
        name: spoutbreeze
        user: spoutbreeze_u
        pass: ''
        port: 5432
        charset: utf8

    development:
        adapter: pgsql
        host: postgres
        name: spoutbreeze
        user: spoutbreeze_u
        pass: 'spoutbreeze_pass'
        port: 5432
        charset: utf8

    testing:
        adapter: pgsql
        host: localhost
        name: spoutbreeze
        user: spoutbreeze_test_u
        pass: 'spoutbreeze_test'
        port: 5432
        charset: utf8

version_order: creation
