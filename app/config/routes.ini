[routes]
; default route
GET @home : / = Actions\Core\Main->execute

; locale switcher
PUT|POST @set_locale : /set-locale/@locale = Actions\Account\SetLocale->execute

; console
GET @login : /login = Actions\Auth\Login->show
POST @login_submit : /login = Actions\Auth\Login->submit
GET|POST @logout : /logout = Actions\Auth\Logout->execute
GET @forgot : /forgot = Actions\Auth\Forgot->show
POST @forgot_submit : /forgot = Actions\Auth\Forgot->submit
GET @reset : /reset/@token = Actions\Auth\Reset->show
POST @reset_submit : /reset/@token = Actions\Auth\Reset->submit
GET @users : /users = Actions\Users\Index->execute
POST @users_create : /users = Actions\Users\Create->execute
POST @users_delete : /users/@id/delete = Actions\Users\Delete->execute
POST @users_toggle : /users/@id/toggle = Actions\Users\Toggle->execute
POST @users_reset_password : /users/@id/password = Actions\Users\ResetPassword->execute
GET @profile : /profile = Actions\Users\Profile->execute
POST @profile_update : /profile = Actions\Users\Profile->submit

GET @destinations : /destinations = Actions\Destinations\Index->execute
POST @destinations_create : /destinations = Actions\Destinations\Create->execute
POST @destinations_delete : /destinations/@id/delete = Actions\Destinations\Delete->execute
POST @destinations_toggle : /destinations/@id/toggle = Actions\Destinations\Toggle->execute

GET @broadcasts : /broadcasts = Actions\Broadcasts\Index->execute
POST @broadcasts_start : /broadcasts = Actions\Broadcasts\Start->execute
POST @broadcasts_stop : /broadcasts/@id/stop = Actions\Broadcasts\Stop->execute

; probes
GET @healthz : /healthz = Sukarix\Actions\Health\Probe->liveness
GET @readyz : /readyz = Sukarix\Actions\Health\Probe->readiness

; assets routes
GET @locale : /locale/json/@locale.json = Sukarix\Actions\Core\GetLocale->execute

GET @api_streamer_job : /api/v1/streamer/jobs/@token = Api\Actions\V1\StreamerJobs->fetch
POST @api_streamer_job_heartbeat : /api/v1/streamer/jobs/@token/heartbeat = Api\Actions\V1\StreamerJobs->heartbeat
POST @api_broadcasts_start : /api/v1/broadcasts = Api\Actions\V1\Broadcasts->start
POST @api_broadcasts_stop : /api/v1/broadcasts/@id/stop = Api\Actions\V1\Broadcasts->stop
GET @api_broadcast_job : /api/v1/broadcasts/@token = Api\Actions\V1\Broadcasts->jobStatus
POST @api_agent_job_ready : /api/v1/agent/jobs/@token/ready = Api\Actions\V1\AgentJobs->ready
GET @api_player_audio : /api/v1/player/audio/@meeting = Api\Actions\V1\PlayerAudio->status
POST @api_player_audio_token : /api/v1/player/audio/@meeting = Api\Actions\V1\PlayerAudio->token
[MULTILANG]
global = locale,/api,/cli,set_locale,/healthz,/readyz,/broadcasts,/destinations,/login,/logout,/forgot,/reset,/users,/profile
languages[en] = en-GB
languages[fr] = fr-FR
languages[de] = de-DE
languages[es] = es-ES
languages[pt] = pt-BR
languages[pg] = pt-PT
languages[th] = th-TH
languages[zh] = zh-CN
languages[tw] = zh-TW
languages[vi] = vi-VN
languages[ar] = ar-SA
languages[nl] = nl-NL
languages[it] = it-IT
languages[ru] = ru-RU
languages[ja] = ja-JP
languages[uk] = uk-UA
