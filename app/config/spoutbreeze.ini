; Application defaults, loaded through the CONFIGS list in default.ini and
; therefore before config-<environment>.ini, which overrides what it needs.
;
; Nothing sensitive belongs in this file: no passwords, no API keys, no
; encryption key. It is tracked, and it ships inside the image. Credentials
; live in the environment's own file — config-development.ini for local work,
; config-production.ini (gitignored, mounted at runtime) for an install.
;
; Keys are declared here even when empty so the shape of the configuration is
; visible in one place and `tools/sb config` can report what is unset.

[globals]

; Console database: users, sessions, destinations.
spoutbreeze.db.dsn = pgsql:host=postgres;port=5432;dbname=spoutbreeze_app
spoutbreeze.db.username = spoutbreeze_u
spoutbreeze.db.password =

; Broadcast domain database, shared with the JVM services.
spoutbreeze.domain.db.dsn = pgsql:host=postgres;port=5432;dbname=spoutbreeze
spoutbreeze.domain.db.username = spoutbreeze_u
spoutbreeze.domain.db.password =

spoutbreeze.amqp.dsn =
spoutbreeze.redis.host = redis
spoutbreeze.sink_url = rtmp://mediamtx:1935/live/spoutbreeze

; Machine API bearer key for /api/v1.
spoutbreeze.api.key =

; Seals saved destination credentials at rest (64 hex characters).
; Generate one per install: tools/sb secret-key
spoutbreeze.secret_key =

; Player audio over LiveKit. BigBlueButton 4.0 carries meeting audio on
; LiveKit, so a watch-page viewer can be invited into the live conversation.
; Off by default: a viewer admitted this way is a LiveKit participant, not a
; BigBlueButton user, so moderators cannot mute or eject them from the
; BigBlueButton interface. Speaking is a second, separate switch.
spoutbreeze.livekit.audio_invite = false
spoutbreeze.livekit.allow_speaking = false
spoutbreeze.livekit.url =
spoutbreeze.livekit.key =
spoutbreeze.livekit.secret =
spoutbreeze.livekit.ttl = 14400

; BigBlueButton 4.0 signs API calls with SHA-256.
spoutbreeze.bbb.checksum_algo = sha256

; Optional legacy fallback for a pasted YouTube token.
spoutbreeze.youtube.access_token =

; Bootstrap admin, created once by tools/seed-admin.php on the first start
; that finds no account with this address, then never modified. Leave the
; password unset and a strong one is generated and printed once.
spoutbreeze.admin.email = admin@spoutbreeze.local
spoutbreeze.admin.username = admin
spoutbreeze.admin.password =
