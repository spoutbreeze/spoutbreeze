[ACCESS]
; deny everything that is not explicitly allowed
policy = deny

[ACCESS.rules]
; auth screens are public
allow @login = *
allow @login_submit = *
allow @logout = *
allow @forgot = *
allow @forgot_submit = *
allow @reset = *
allow @reset_submit = *

; machine API endpoints authenticate with their own bearer keys
allow @api_streamer_job = *
allow @api_streamer_job_heartbeat = *
allow @api_agent_job_ready = *
allow @api_player_audio = *
allow @api_player_audio_token = *
allow @api_broadcasts_start = *
allow @api_broadcasts_stop = *
allow @api_broadcast_job = *

; operator console requires the admin role
allow @home = admin
allow @broadcasts = admin
allow @broadcasts_start = admin
allow @broadcasts_stop = admin
allow @destinations = admin
allow @destinations_create = admin
allow @destinations_delete = admin
allow @destinations_toggle = admin
allow @users = admin
allow @users_create = admin
allow @users_delete = admin
allow @users_toggle = admin
allow @users_reset_password = admin
allow @profile = admin
allow @profile_update = admin

; locale helpers
allow @healthz = *
allow @readyz = *
allow @locale = *
allow @set_locale = *
