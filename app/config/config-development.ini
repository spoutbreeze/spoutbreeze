[globals]
; Stack trace verbosity. Assign values 1 to 3 for increasing verbosity levels. Zero (0) suppresses the stack trace.
; This is the default value and it should be the assigned setting on a production server.
DEBUG = 3

; database settings
; db.driver = pgsql
db.dsn = pgsql:host=postgres;port=5432;dbname=spoutbreeze_app
db.username = spoutbreeze_u
db.password = spoutbreeze_pass

; Settings
ORGANISATION = RIADVICE

; default locale for new sessions
application.locale = en-GB

; turn javascript and css minification on and off
MINIFY_CSS = FALSE
MINIFY_JS  = FALSE

; set to development|testing|staging|production|local or whatever you like
application.environment = development

; log session queries
; log.session = true
log.level = debug

TZ = UTC

log.json = TRUE

; stack cache
CACHE = redis=redis

; SpoutBreeze credentials for local development only. The non-sensitive
; defaults are in spoutbreeze.ini; these are the values that must never be
; in a file that ships, and they are safe here only because this file
; configures throwaway containers.
spoutbreeze.db.password = spoutbreeze_pass
spoutbreeze.domain.db.password = spoutbreeze_pass
spoutbreeze.amqp.dsn = amqp://spoutbreeze:spoutbreeze@rabbitmq:5672
spoutbreeze.api.key = spoutbreeze-dev-api-key
spoutbreeze.secret_key = 00000000000000000000000000000000000000000000000000000000devkey01
