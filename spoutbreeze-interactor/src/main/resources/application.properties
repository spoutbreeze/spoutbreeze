micronaut.application.name=spoutbreeze-interactor
micronaut.server.port=8081
micronaut.http.services.api.url=${SPB_API_URL:http://localhost:8090/api}
micronaut.http.services.api.read-timeout=5s
redis.uri=${REDIS_URI:redis://localhost:6379}
rabbitmq.uri=${RABBITMQ_URI:amqp://spoutbreeze:spoutbreeze@localhost:5672}
spoutbreeze.api.user=${SPB_API_USER:api@spoutbreeze.test}
spoutbreeze.api.password=${SPB_API_PASSWORD:api_password}
spoutbreeze.bbb.callback-base=${SPB_CALLBACK_BASE:http://localhost:8081}
spoutbreeze.bbb.secret=${SPB_BBB_SECRET:spoutbreeze-bbb-secret}
spoutbreeze.bbb.checksum-algo=${SPB_BBB_CHECKSUM_ALGO:sha256}
endpoints.health.enabled=true
datasources.default.url=${JDBC_URL:jdbc:postgresql://localhost:5432/spoutbreeze}
datasources.default.username=${JDBC_USER:spoutbreeze_u}
datasources.default.password=${JDBC_PASSWORD:spoutbreeze_pass}
datasources.default.driver-class-name=org.postgresql.Driver
chat.twitch.enabled=${CHAT_TWITCH_ENABLED:false}
chat.twitch.token=${TWITCH_CHAT_TOKEN:}
chat.twitch.nick=${TWITCH_CHAT_NICK:spoutbreeze-bot}
chat.twitch.channel=${TWITCH_CHAT_CHANNEL:}
chat.relay.min-interval-ms=${CHAT_MIN_INTERVAL_MS:2000}
chat.facebook.enabled=${CHAT_FACEBOOK_ENABLED:false}
chat.facebook.token=${FACEBOOK_CHAT_TOKEN:}
chat.facebook.poll-ms=${CHAT_FACEBOOK_POLL_MS:10000}
